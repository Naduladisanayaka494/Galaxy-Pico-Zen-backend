# Build the Spring Boot jar and deploy it to the VPS over SSH — no Docker.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST   VPS IP or hostname
#   SSH_USER   deploy
#   SSH_KEY    the PRIVATE key whose .pub is in /home/deploy/.ssh/authorized_keys
#   SSH_PORT   optional, only if sshd is not on 22
#
# The server already holds /opt/galaxy/galaxy.env with the DB/JWT/SMTP config;
# nothing secret is built into the jar.
name: Build & deploy API

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: |
          chmod +x ./mvnw
          ./mvnw -B -Dmaven.test.skip=true package
          mv target/galaxy-*.jar galaxy.jar.new

      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: galaxy.jar.new
          target: /opt/galaxy

      - name: Swap in and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            mv -f /opt/galaxy/galaxy.jar.new /opt/galaxy/galaxy.jar
            sudo /usr/bin/systemctl restart galaxy
            sleep 6
            sudo /usr/bin/systemctl --no-pager status galaxy | head -n 20
