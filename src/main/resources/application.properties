# Loads .env (KEY=VALUE, same syntax as .properties) as real config, so it
# works no matter how the app is started — IDE run button, plain `mvnw
# spring-boot:run`, whatever — without anyone having to manually export it
# into the shell first. `optional:` so a fresh checkout with no .env yet
# doesn't fail to boot.
spring.config.import=optional:file:.env[.properties]

spring.cloud.aws.region.static=${AWS_REGION:eu-north-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:picozen-frontend}
aws.region=${AWS_REGION:eu-north-1}
spring.datasource.url=${DB_URL:jdbc:postgresql://database-1.c9a8c0cma54a.eu-north-1.rds.amazonaws.com:5432/postgres?currentSchema=galaxy,public}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# --- Flyway: platform schema (knox + public) only ---
# Runs automatically at boot, before Hibernate's ddl-auto=validate. Location
# is scoped to db/migration/platform so this instance never sees (or tries
# to run) the tenant migrations under db/migration/tenant — those are applied
# per-schema by TenantMigrationService, not by this auto-configured instance.
#
# baseline-on-migrate adopts Flyway into the database that was originally
# built by hand (platform_bootstrap.sql + knox_platform.sql, run once
# manually): on a schema that already has these tables but no
# flyway_schema_history yet, it marks V1 as already applied instead of
# re-running it. On a genuinely empty schema (fresh dev DB) it just runs V1
# for real, baseline never triggers. Either way every migration from V2 on
# is tracked and applied exactly once — see db/migration/platform/.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/platform
spring.flyway.schemas=knox,public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline: platform schema as of the role_id migration

spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e5f8g2h6j9k0l3m6n5o8p1q4r7s0t3u6v9w2x5y8z1a4b7c0d3e}
# Platform (KNOX staff) tokens only. No refresh mechanism exists for platform
# auth yet, so this stays a full session length.
jwt.expiration=${JWT_EXPIRATION:86400000}
# Tenant access tokens only — short-lived, renewed via POST /api/auth/refresh.
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
# How long a refresh token (knox.refresh_tokens row + httpOnly cookie) stays
# valid before the user must fully log in again.
galaxy.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Comma-separated explicit origin allow-list for CORS (never "*" — combined
# with credentialed cookies, wildcard would let any site ride on them).
galaxy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}

# Schema Hibernate's ddl-auto=validate checks at startup, before any tenant is
# bound. Must carry the full tenant table set; galaxy is kept structurally
# identical to every tenant_<slug> for exactly this reason.
galaxy.tenancy.template-schema=${TENANCY_TEMPLATE_SCHEMA:galaxy}

# First KNOX staff account. Applied only when knox.platform_users is empty, so
# a redeploy never resets an existing admin's password. Leave unset in
# production once the account exists.
galaxy.platform.bootstrap-email=${PLATFORM_BOOTSTRAP_EMAIL:}
galaxy.platform.bootstrap-password=${PLATFORM_BOOTSTRAP_PASSWORD:}
galaxy.platform.bootstrap-name=${PLATFORM_BOOTSTRAP_NAME:KNOX Admin}

# --- Outbound email (new tenant welcome messages) ---
# Gmail SMTP by default: MAIL_USERNAME is the sending Gmail address,
# MAIL_PASSWORD is a 16-char Google App Password (not the account password —
# Gmail rejects plain passwords over SMTP). Generate one at
# https://myaccount.google.com/apppasswords (requires 2-Step Verification on).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# "From" address on outgoing mail; falls back to the SMTP username if unset.
galaxy.mail.from=${MAIL_FROM:${spring.mail.username}}
# Where the welcome email sends new tenant owners to log in.
galaxy.frontend.url=${GALAXY_FRONTEND_URL:http://localhost:5173}
