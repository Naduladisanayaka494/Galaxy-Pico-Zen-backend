# Spring Datasource properties (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/galaxy_db?currentSchema=galaxy,public
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT properties (256-bit or greater key encoded in hex/plaintext for HMAC-SHA256)
jwt.secret=9a4f2c8d3b7a1e5f8g2h6j9k0l3m6n5o8p1q4r7s0t3u6v9w2x5y8z1a4b7c0d3e
# Token validity: 24 hours (in milliseconds)
jwt.expiration=86400000

# Server port
server.port=8080
